<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>ETHRAWL ES STATE</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #000;
    }
    .logo-wrap {
      width: min(92vw, 900px);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-wrap img {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <main class="logo-wrap">
    <img src="assets/logo.png" alt="ETHRAWL ES STATE">
  </main>
</body>
</html>
